apiVersion: apps/v1
kind: Deployment
metadata:
  name: airline-django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airline-web
  template:
    metadata:
      labels:
        app: airline-web
    spec:
      containers:
      - name: django
        image: your-dockerhub-username/airline-app:latest
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_DB
          value: airlinedb
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgrespassword
        - name: POSTGRES_HOST
          value: db
---
apiVersion: v1
kind: Service
metadata:
  name: airline-service
spec:
  type: NodePort
  selector:
    app: airline-web
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30007